# podinfo/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: podinfo
spec:
  replicas: 1
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      imagePullSecrets: [{name: harbor-pull}]
      containers:
      - name: podinfo
        image: harbor.site-a.vcf.lab/demo/podinfo:1.0
        ports: [{containerPort: 9898}]
        env:
        - {name: PODINFO_UI_MESSAGE, value: "Hello from VCF 1.0"}
        - {name: PODINFO_UI_COLOR, value: "#1d428a"}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: podinfo
spec:
  type: LoadBalancer
  selector: {app: podinfo}
  ports: [{port: 80, targetPort: 9898}]
