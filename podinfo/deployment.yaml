apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  replicas: 1
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      imagePullSecrets:
      - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: podinfo
        image: depot.kube-system.svc/demos/podinfo:6.7.1
        ports: [{containerPort: 9898}]
        env:
        - {name: PODINFO_UI_MESSAGE, value: "Something else"}
        - {name: PODINFO_UI_COLOR, value: "#1d428a"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
spec:
  type: LoadBalancer
  selector: {app: podinfo}
  ports: [{port: 80, targetPort: 9898}]
